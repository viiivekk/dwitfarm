{% extends "admin/base.html" %}
{% block title %}Account{% endblock %}
{% block content %}

<h1 style="margin-bottom:24px;">Account</h1>

<div class="admin-card" style="max-width:480px;">
  <p style="margin-bottom:18px;">Logged in as <strong>{{ user.username }}</strong>. Change your password below.</p>
  <form method="POST" class="admin-form">
    <label>Current password <input type="password" name="current_password" required></label>
    <label>New password <input type="password" name="new_password" required minlength="8"></label>
    <label>Confirm new password <input type="password" name="confirm_password" required minlength="8"></label>
    <button type="submit" class="btn btn-red" style="border:none;cursor:pointer;align-self:flex-start;">Update Password</button>
  </form>
</div>

{% endblock %}
